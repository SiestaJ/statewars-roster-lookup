<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>State Wars Roster Lookup</title>
  <link rel="icon" href="./assets/statewars-logo.jpg" />
  <link rel="stylesheet" href="./styles.css?v=20260802h" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-card" aria-label="RHA Lookup">
        <img class="statewars-logo" src="./assets/statewars-logo.jpg" alt="State Wars Hockey logo" />
        <div class="brand-copy">
          <h1>RHA Lookup</h1>
          <div id="pdfMeta" class="pdf-meta">Loading RHA PDF status…</div>
        </div>
      </div>
    </header>

    <section class="card controls" aria-label="Lookup controls">
      <label>
        <span class="sr-only">Year</span>
        <select id="seasonSelect" aria-label="Year"></select>
      </label>
      <label>
        <span class="sr-only">Tournament</span>
        <select id="tournamentSelect" aria-label="Tournament"></select>
      </label>
      <label>
        <span class="sr-only">Division</span>
        <select id="divisionSelect" aria-label="Division"></select>
      </label>
      <label>
        <span class="sr-only">Team</span>
        <select id="teamSelect" aria-label="Team"></select>
      </label>
      <label>
        <span class="sr-only">Last Name</span>
        <input id="searchInput" type="search" placeholder="Last Name" aria-label="Last Name" autocomplete="off" />
      </label>
      <button id="lookupBtn" class="button" type="button">Load Players</button>
      <label class="url-field">
        <span class="sr-only">Custom tournament/team URL</span>
        <input id="tournamentUrlInput" type="url" placeholder="Paste tournament URL" aria-label="Custom tournament/team URL" autocomplete="off" />
      </label>
      <div class="utility-menu">
        <button id="utilityMenuBtn" class="button button-white menu-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="utilityMenuPanel" aria-label="Open utility menu">☰</button>
        <div id="utilityMenuPanel" class="utility-menu-panel" role="menu" hidden>
          <button id="applyUrlBtn" class="button button-white" type="button" role="menuitem">Use URL</button>
          <button id="refreshBtn" class="button button-white utility-button" type="button" role="menuitem">Reload Divisions</button>
          <a class="button button-red utility-button" id="updateRhaBtn" href="https://www.rollerhockeyalliance.com/player-member-list" target="_blank" rel="noopener" role="menuitem">RHA Source</a>
        </div>
      </div>
    </section>

    <section class="status-row">
      <div id="status" class="status">Loading…</div>
      <div id="counts" class="counts"></div>
    </section>

    <section id="opsOverview" class="card ops-overview" aria-label="Ops status overview" hidden></section>

    <section class="results-actions" aria-label="Result actions">
      <button id="exportBtn" class="button button-white" type="button" hidden>Export CSV</button>
    </section>

    <section class="card results-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th class="rha-col">RHA</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="3" class="empty">Choose a division, then load players.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260802h" type="module"></script>
</body>
</html>
