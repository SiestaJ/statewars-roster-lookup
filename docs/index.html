<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>State Wars Roster Lookup</title>
  <link rel="stylesheet" href="./styles.css?v=20260802" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-card" aria-label="State Wars Roster RHA Lookup">
        <div class="statewars-logo" aria-hidden="true">
          <span class="logo-mark">🏒</span>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">State Wars Hockey</p>
          <h1>Roster RHA Lookup</h1>
          <p class="subhead">Pick a division and team. The roster comes live from HockeyShift/DigitalShift, then matches against the current RHA PDF.</p>
          <div id="pdfMeta" class="pdf-meta">Loading RHA PDF status…</div>
        </div>
        <div class="hero-actions">
          <a class="button button-red" id="updateRhaBtn" href="https://github.com/SiestaJ/statewars-roster-lookup/actions/workflows/refresh-pdf.yml" target="_blank" rel="noopener">Update RHA list</a>
          <button id="refreshBtn" class="button button-white" type="button">Refresh tournament</button>
        </div>
      </div>
    </header>

    <section class="card controls" aria-label="Lookup controls">
      <label>
        Division
        <select id="divisionSelect"></select>
      </label>
      <label>
        Team
        <select id="teamSelect"></select>
      </label>
      <label>
        Last Name
        <input id="searchInput" type="search" placeholder="Last Name" autocomplete="off" />
      </label>
      <button id="lookupBtn" class="button" type="button">Lookup roster</button>
    </section>

    <section class="status-row">
      <div id="status" class="status">Loading…</div>
      <div id="counts" class="counts"></div>
    </section>

    <section class="card results-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>RHA Match</th>
              <th>RHA Details</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="4" class="empty">Choose a team.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260802" type="module"></script>
</body>
</html>
