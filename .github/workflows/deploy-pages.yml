name: Build and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate PDF lookup for deploy artifact
        env:
          PDF_URL: ${{ vars.PDF_URL || secrets.PDF_URL }}
        run: |
          # If PDF_URL is unset, scripts/parse_pdf.py discovers the current
          # "Click Here for Recent List" PDF from the RHA member-list page.
          python scripts/parse_pdf.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
