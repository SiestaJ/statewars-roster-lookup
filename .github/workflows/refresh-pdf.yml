name: Refresh parsed PDF lookup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  refresh-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse PDF
        env:
          PDF_URL: ${{ vars.PDF_URL || secrets.PDF_URL }}
        run: |
          # If PDF_URL is unset, scripts/parse_pdf.py discovers the current
          # "Click Here for Recent List" PDF from the RHA member-list page.
          python scripts/parse_pdf.py
      - name: Commit updated lookup JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh parsed PDF lookup
          file_pattern: docs/data/pdf_lookup.json
